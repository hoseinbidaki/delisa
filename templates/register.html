<section class="auth-wrap dl-auth" aria-labelledby="dl-auth-heading">
  <div class="dl-auth-shell">
    <div class="auth-card dl-auth-card">
      <div class="dl-auth-head"><a href="/" class="dl-auth-wordmark" aria-label="صفحه اصلی دلیسا">DELISA <span>ATELIER</span></a><span class="dl-auth-index">حساب کاربری / ۰۲</span></div>
      <div class="dl-auth-intro"><span class="dl-auth-kicker">یک شروع تازه</span><h1 id="dl-auth-heading">به دنیای <em>دلیسا</em> خوش اومدی.</h1><p>با ساخت حساب، سفارش‌هات و آدرس‌هات همیشه کنارته.</p></div>
      $error
      <form method="post" action="/register" class="form dl-auth-form" data-dl-auth-form>
        <input type="hidden" name="csrf" value="$csrf">
        <label for="dl-register-name">نام و نام خانوادگی
          <input id="dl-register-name" name="name" maxlength="100" autocomplete="name" required placeholder="نام و نام خانوادگی">
        </label>
        <label for="dl-register-email">ایمیل
          <input id="dl-register-email" dir="ltr" name="email" type="email" inputmode="email" maxlength="254" autocomplete="email" required placeholder="you@example.com">
        </label>
        <label for="dl-register-phone">شماره موبایل <small>اختیاری؛ تا زمان ثبت سفارش</small>
          <input id="dl-register-phone" dir="ltr" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0912...">
        </label>
        <label for="dl-register-password">رمز عبور <small>حداقل ۸ کاراکتر</small>
          <span class="dl-auth-password"><input id="dl-register-password" dir="ltr" name="password" type="password" minlength="8" autocomplete="new-password" required placeholder="یک رمز امن انتخاب کن"><button type="button" data-dl-password-toggle aria-controls="dl-register-password" aria-label="نمایش رمز عبور" aria-pressed="false">نمایش</button></span>
        </label>
        <button class="btn dl-auth-submit" type="submit"><span>ساخت حساب دلیسا</span><span aria-hidden="true">←</span></button>
      </form>
      <p class="auth-extra dl-auth-extra">قبلاً عضو شدی؟ <a href="/login" class="underlined">ورود به حساب <span aria-hidden="true">←</span></a></p>
      <div class="dl-auth-footer">استایلِ شخصی، تجربه‌ای ساده.</div>
    </div>
    <aside class="dl-auth-visual dl-auth-visual-register" aria-hidden="true"><img src="/static/img/delisa-v123-navy-640.webp" alt="" width="640" height="853" decoding="async" loading="lazy"><div class="dl-auth-visual-top">دلیسا / آتلیه</div><div class="dl-auth-visual-bottom"><i></i><strong>سادگیِ انتخاب‌شده.</strong><small>برای لحظه‌هایی که می‌خوای خودت باشی</small></div></aside>
  </div>
</section>
